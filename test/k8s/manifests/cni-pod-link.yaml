apiVersion: v1
kind: ConfigMap
metadata:
  name: cni-pod-link
  namespace: kube-system
data:
  cni-config: |-
    {
      "cniVersion": "0.3.1",
      "name": "pod-link",
      "plugins": [
        {
          "type": "ipvlan",
          "ipam": {
            "type": "host-local",
            "subnet": "10.1.2.0/24"
          }
        },
        {
          "type": "cilium-cni"
        }
      ]
    }
