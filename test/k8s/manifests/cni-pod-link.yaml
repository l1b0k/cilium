apiVersion: v1
kind: ConfigMap
metadata:
  name: cni-pod-link
  namespace: kube-system
data:
  cni-config: |
    {
       "cniVersion": "0.3.1",
       "name": "pod-link",
       "plugins": [
          {
             "type": "ipvlan",
             "ipam": {
                "type": "host-local",
                "subnet": "172.18.0.0/16",
                "rangeStart": "172.18.1.100",
                "rangeEnd": "172.18.1.150",
                "gateway": "172.18.0.1",
                "routes": [{
                   "dst": "0.0.0.0/0"
                }]
             }
          },
          {
             "name": "cilium",
             "type": "cilium-cni"
          }
       ]
    }
